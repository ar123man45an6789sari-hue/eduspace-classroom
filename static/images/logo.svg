<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 50" width="200" height="50">
  <defs>
    <linearGradient id="iconGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
  </defs>
  <!-- Icon circle background -->
  <circle cx="25" cy="25" r="22" fill="url(#iconGrad)"/>
  <!-- Video camera icon -->
  <rect x="12" y="18" width="18" height="14" rx="3" fill="white"/>
  <polygon points="30,18 40,13 40,37 30,32" fill="white"/>
  <!-- Recording dot -->
  <circle cx="16" cy="22" r="3" fill="#ef4444"/>
  <!-- Text -->
  <text x="55" y="20" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#4f46e5">Zooming</text>
  <text x="55" y="38" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#7c3aed">CLS</text>
</svg>
