<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="bookGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#4f46e5"/>
      <stop offset="100%" style="stop-color:#7c3aed"/>
    </linearGradient>
    <linearGradient id="bookGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0ea5e9"/>
      <stop offset="100%" style="stop-color:#6366f1"/>
    </linearGradient>
    <linearGradient id="bookGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f97316"/>
      <stop offset="100%" style="stop-color:#fbbf24"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="130" r="110" fill="#eef2ff" opacity="0.7"/>

  <!-- Shadow under books -->
  <ellipse cx="200" cy="225" rx="85" ry="12" fill="#c7d2fe" opacity="0.4"/>

  <!-- Book 3 (back right) -->
  <g transform="rotate(12, 200, 180)">
    <rect x="215" y="110" width="55" height="110" rx="4" fill="url(#bookGrad3)"/>
    <rect x="215" y="110" width="10" height="110" rx="2" fill="rgba(0,0,0,0.1)"/>
    <rect x="222" y="130" width="35" height="5" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="222" y="142" width="28" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
    <rect x="222" y="154" width="32" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Book 2 (back left) -->
  <g transform="rotate(-10, 200, 180)">
    <rect x="130" y="115" width="55" height="105" rx="4" fill="url(#bookGrad2)"/>
    <rect x="130" y="115" width="10" height="105" rx="2" fill="rgba(0,0,0,0.1)"/>
    <rect x="138" y="135" width="30" height="5" rx="2" fill="rgba(255,255,255,0.5)"/>
    <rect x="138" y="148" width="22" height="5" rx="2" fill="rgba(255,255,255,0.35)"/>
  </g>

  <!-- Main book (front) -->
  <rect x="155" y="100" width="90" height="120" rx="5" fill="url(#bookGrad)" filter="drop-shadow(0 4px 10px rgba(79,70,229,0.3))"/>
  <rect x="155" y="100" width="15" height="120" rx="3" fill="rgba(0,0,0,0.12)"/>
  <!-- Pages edge -->
  <rect x="240" y="102" width="5" height="116" rx="1" fill="#e2e8f0"/>
  <!-- Book title lines -->
  <rect x="176" y="124" width="52" height="8" rx="4" fill="rgba(255,255,255,0.9)"/>
  <rect x="180" y="140" width="44" height="5" rx="2" fill="rgba(255,255,255,0.5)"/>
  <rect x="178" y="152" width="48" height="5" rx="2" fill="rgba(255,255,255,0.5)"/>
  <!-- Bookmark ribbon -->
  <polygon points="220,100 230,100 230,120 225,115 220,120" fill="#fbbf24"/>

  <!-- Plus button circle -->
  <circle cx="270" cy="108" r="24" fill="#4f46e5" filter="drop-shadow(0 4px 10px rgba(79,70,229,0.4))"/>
  <rect x="258" y="106" width="24" height="4" rx="2" fill="white"/>
  <rect x="268" y="96" width="4" height="24" rx="2" fill="white"/>

  <!-- Stars decoration -->
  <text x="90" y="90" font-size="16" opacity="0.6">⭐</text>
  <text x="310" y="155" font-size="12" opacity="0.5">✨</text>
  <text x="75" y="185" font-size="10" opacity="0.4">💫</text>

  <!-- Text below -->
  <text x="200" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4f46e5" text-anchor="middle">No Classrooms Yet</text>
  <text x="200" y="276" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Create or join a classroom to get started</text>
</svg>
