<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Sign In — ZoomingCLS</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: 'Inter', sans-serif; background: linear-gradient(135deg, #eef2ff, #dbeafe); min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
    .card { background: white; border-radius: 16px; box-shadow: 0 8px 32px rgba(0,0,0,.12); width: 100%; max-width: 400px; padding: 40px; }
    .logo { text-align: center; margin-bottom: 32px; }
    .logo .icon { font-size: 3rem; color: #4f46e5; }
    .logo h1 { font-size: 1.6rem; font-weight: 700; color: #4f46e5; margin-top: 8px; }
    .logo p { color: #6b7280; font-size: .9rem; margin-top: 4px; }
    .form-group { margin-bottom: 18px; }
    .form-label { display: block; font-size: .875rem; font-weight: 500; margin-bottom: 6px; }
    .form-control { width: 100%; padding: 10px 12px; border: 1px solid #e5e7eb; border-radius: 8px; font-size: .9rem; font-family: inherit; }
    .form-control:focus { outline: none; border-color: #4f46e5; box-shadow: 0 0 0 3px rgba(79,70,229,.1); }
    .btn { width: 100%; padding: 11px; background: #4f46e5; color: white; border: none; border-radius: 8px; font-size: 1rem; font-weight: 600; cursor: pointer; margin-top: 4px; transition: background .15s; display: flex; align-items: center; justify-content: center; gap: 8px; }
    .btn:hover { background: #4338ca; }
    .footer { text-align: center; margin-top: 22px; font-size: .875rem; color: #6b7280; }
    .footer a { color: #4f46e5; font-weight: 500; }
    .alert { padding: 10px 14px; background: #fee2e2; color: #991b1b; border-radius: 8px; font-size: .875rem; margin-bottom: 16px; }
    .errorlist { list-style: none; }
    .errorlist li { font-size: .8rem; color: #dc2626; margin-top: 3px; }
  </style>
</head>
<body>
<div class="card">
  <div class="logo">
    <div class="icon"><i class="fa-solid fa-video"></i></div>
    <h1>ZoomingCLS</h1>
    <p>Sign in to your account</p>
  </div>

  {% if form.errors %}
  <div class="alert">
    <i class="fa-solid fa-circle-exclamation"></i>
    Your username or password is incorrect. Please try again.
  </div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="form-group">
      <label class="form-label" for="id_username">Username</label>
      <input type="text" name="username" id="id_username" class="form-control" autofocus autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="id_password">Password</label>
      <input type="password" name="password" id="id_password" class="form-control" autocomplete="current-password" required>
    </div>
    <button type="submit" class="btn">
      <i class="fa-solid fa-right-to-bracket"></i> Sign In
    </button>
  </form>

  <div class="footer">
    <p>Don't have an account? <a href="{% url 'register' %}">Sign up</a></p>
    <p style="margin-top:8px;"><a href="{% url 'password_reset' %}">Forgot password?</a></p>
  </div>
</div>
</body>
</html>
