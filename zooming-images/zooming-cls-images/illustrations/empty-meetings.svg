<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="400" height="300">
  <defs>
    <linearGradient id="screenGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0f172a"/>
      <stop offset="100%" style="stop-color:#1e293b"/>
    </linearGradient>
    <linearGradient id="camGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366f1"/>
      <stop offset="100%" style="stop-color:#4f46e5"/>
    </linearGradient>
    <linearGradient id="tileGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1d4ed8"/>
      <stop offset="100%" style="stop-color:#1e40af"/>
    </linearGradient>
    <linearGradient id="tileGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#065f46"/>
      <stop offset="100%" style="stop-color:#047857"/>
    </linearGradient>
  </defs>

  <!-- Background circle -->
  <circle cx="200" cy="135" r="110" fill="#dbeafe" opacity="0.4"/>

  <!-- Monitor/screen base -->
  <rect x="170" y="215" width="60" height="10" rx="3" fill="#94a3b8"/>
  <rect x="155" y="224" width="90" height="6" rx="3" fill="#94a3b8"/>

  <!-- Monitor body -->
  <rect x="100" y="80" width="200" height="135" rx="10" fill="url(#screenGrad)" filter="drop-shadow(0 8px 20px rgba(0,0,0,0.2))"/>
  <!-- Screen inner border -->
  <rect x="105" y="85" width="190" height="125" rx="7" fill="#0f172a"/>
  <!-- Screen bezel bottom -->
  <rect x="100" y="195" width="200" height="20" rx="10" fill="#1e293b"/>
  <circle cx="200" cy="205" r="4" fill="#334155"/>

  <!-- 4-way video grid on screen -->
  <!-- Top-left tile -->
  <rect x="110" y="90" width="90" height="58" rx="5" fill="url(#tileGrad1)"/>
  <circle cx="155" cy="110" r="14" fill="#3b82f6"/>
  <circle cx="155" cy="110" r="9" fill="#93c5fd"/>
  <rect x="140" y="128" width="30" height="15" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="144" y="132" width="22" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>
  <rect x="146" y="139" width="18" height="3" rx="1" fill="rgba(255,255,255,0.25)"/>

  <!-- Top-right tile -->
  <rect x="205" y="90" width="90" height="58" rx="5" fill="url(#tileGrad2)"/>
  <circle cx="250" cy="110" r="14" fill="#10b981"/>
  <circle cx="250" cy="110" r="9" fill="#6ee7b7"/>
  <rect x="235" y="128" width="30" height="15" rx="3" fill="rgba(255,255,255,0.1)"/>
  <rect x="239" y="132" width="22" height="4" rx="2" fill="rgba(255,255,255,0.4)"/>

  <!-- Bottom-left tile -->
  <rect x="110" y="153" width="90" height="55" rx="5" fill="#4c1d95"/>
  <circle cx="155" cy="172" r="14" fill="#8b5cf6"/>
  <circle cx="155" cy="172" r="9" fill="#c4b5fd"/>
  <rect x="140" y="190" width="30" height="13" rx="3" fill="rgba(255,255,255,0.1)"/>

  <!-- Bottom-right tile (YOU - highlighted) -->
  <rect x="205" y="153" width="90" height="55" rx="5" fill="#7c2d12"/>
  <circle cx="250" cy="172" r="14" fill="#f97316"/>
  <circle cx="250" cy="172" r="9" fill="#fdba74"/>
  <!-- "You" label -->
  <rect x="236" y="190" width="28" height="13" rx="6" fill="rgba(255,255,255,0.25)"/>
  <text x="250" y="200" font-family="Arial" font-size="7" fill="white" text-anchor="middle" font-weight="bold">You</text>

  <!-- Meeting control bar on screen -->
  <rect x="140" y="212" width="120" height="0" rx="3" fill="#334155"/>

  <!-- Floating controls outside -->
  <rect x="110" y="230" width="180" height="0" rx="5" fill="transparent"/>

  <!-- Camera icon floating -->
  <circle cx="120" cy="65" r="22" fill="url(#camGrad)" filter="drop-shadow(0 4px 10px rgba(79,70,229,0.35))"/>
  <rect x="110" y="58" width="16" height="14" rx="3" fill="white" opacity="0.9"/>
  <polygon points="126,58 134,54 134,72 126,68" fill="white" opacity="0.9"/>
  <circle cx="118" cy="65" r="4" fill="#4f46e5"/>

  <!-- Live indicator -->
  <rect x="295" y="52" width="48" height="20" rx="10" fill="#ef4444" filter="drop-shadow(0 2px 6px rgba(239,68,68,0.4))"/>
  <circle cx="307" cy="62" r="4" fill="white"/>
  <text x="318" y="66" font-family="Arial" font-size="9" fill="white" font-weight="bold">LIVE</text>

  <!-- Signal waves -->
  <path d="M330,35 Q340,25 350,35" fill="none" stroke="#4f46e5" stroke-width="2.5" stroke-linecap="round" opacity="0.6"/>
  <path d="M323,30 Q340,15 357,30" fill="none" stroke="#4f46e5" stroke-width="2" stroke-linecap="round" opacity="0.4"/>
  <path d="M316,25 Q340,5 364,25" fill="none" stroke="#4f46e5" stroke-width="1.5" stroke-linecap="round" opacity="0.25"/>

  <!-- Text -->
  <text x="200" y="258" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#4f46e5" text-anchor="middle">No Meetings Scheduled</text>
  <text x="200" y="276" font-family="Arial, sans-serif" font-size="12" fill="#6b7280" text-anchor="middle">Your teacher will schedule live sessions here</text>
</svg>
